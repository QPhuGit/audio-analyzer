<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Audio Analyzer</title>
    <meta name="description" content="A real-time RTA and Spectrogram analyzer using the Web Audio API. t.me/Phu_Data">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Audio Frequency Analyzer</h1>
            <div class="controls">
                <div class="spl-display">
                    <span id="splValue">--.-</span> <span class="unit">dB</span>
                </div>
                <button id="startBtn" class="btn primary">Start</button>
                <button id="screenshotBtn" class="btn secondary" title="Save Screenshot">📷</button>
                <button id="freezeBtn" class="btn secondary" title="Freeze Display">⏸️</button>

                <div class="control-group">
                    <label for="response">Response</label>
                    <select id="response">
                        <option value="fast">Fast (125ms)</option>
                        <option value="slow" selected>Slow (1s)</option>
                        <option value="impulse">Impulse (35ms)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="noiseGen">Noise Gen</label>
                    <select id="noiseGen">
                        <option value="off">Off</option>
                        <option value="white">White</option>
                        <option value="pink">Pink</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="resolution">Resolution</label>
                    <select id="resolution">
                        <option value="1">1/1 Oct</option>
                        <option value="3">1/3 Oct</option>
                        <option value="6">1/6 Oct</option>
                        <option value="12" selected>1/12 Oct</option>
                        <option value="24">1/24 Oct</option>
                        <option value="48">1/48 Oct</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="weighting">Weighting</label>
                    <select id="weighting">
                        <option value="Z">Z (None)</option>
                        <option value="A">A-Weight</option>
                        <option value="C" selected>C-Weight</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="displayMode">Display</label>
                    <select id="displayMode">
                        <option value="bar">Bar</option>
                        <option value="line">Line</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="smoothing">Smoothing</label>
                    <input type="range" id="smoothing" min="0" max="0.95" step="0.05" value="0.8">
                </div>
                <div class="control-group">
                    <label for="fftSize">FFT Size</label>
                    <select id="fftSize">
                        <option value="1024">1024</option>
                        <option value="2048">2048</option>
                        <option value="4096">4096</option>
                        <option value="8192">8192 (High)</option>
                        <option value="16384" selected>16384 (Max)</option>
                    </select>
                </div>
                <!-- <div class="control-group">
                    <label for="windowFunc">Window</label>
                    <select id="windowFunc" disabled title="Native Window (Blackman-Harris)">
                        <option value="blackman">Blackman</option>
                    </select>
                </div> -->
                <div class="control-group checkbox-group">
                    <label for="maxHold">Max Hold</label>
                    <input type="checkbox" id="maxHold">
                </div>
                <div class="control-group checkbox-group">
                    <label for="showSplHistory">SPL Graph</label>
                    <input type="checkbox" id="showSplHistory">
                </div>
                <div class="control-group">
                    <label for="calibration">Mic Cal (dB)</label>
                    <input type="number" id="calibration" value="0" step="0.1" style="width:60px;">
                </div>
                <div class="control-group">
                    <label for="specHeight">Spec Height</label>
                    <select id="specHeight">
                        <option value="0.33">1/3</option>
                        <option value="0.5" selected>1/2</option>
                        <option value="0.67">2/3</option>
                    </select>
                </div>
            </div>
        </header>

        <main>
            <section class="viz-unified">
                <div class="note-display" id="noteDisplay">♪ --- | --- Hz | --.- dB</div>
                <div class="rta-area">
                    <canvas id="rtaCanvas"></canvas>
                </div>
                <div class="freq-axis" id="freqAxis"></div>
                <div class="spectrogram-area">
                    <canvas id="spectrogramCanvas"></canvas>
                </div>
            </section>
            <section class="spl-history-section hidden" id="splHistorySection">
                <h3>SPL History (60s)</h3>
                <canvas id="splHistoryCanvas"></canvas>
            </section>
        </main>

    </div>

</body>
